name: CI

on:
  push:
    branches: [ main, '**' ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort
      - name: Ruff
        run: ruff check .
      - name: Black check
        run: black --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services: {}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest alembic ruff black
      - name: Run migrations (sqlite temp)
        env:
          DATABASE_URL: sqlite:///./visionos_ci.db
        run: |
          cd backend
          alembic upgrade head || true
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./visionos_ci.db
        run: |
          cd backend
          pytest tests/unit -q
